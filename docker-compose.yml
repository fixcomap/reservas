services:
  db:
    image: postgres:16
    container_name: reservas-db
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reservas
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

  # Solo para desarrollo: atrapa todos los mails que manda la API (no
  # salen a internet) y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: reservas-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  datos: